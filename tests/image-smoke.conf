# Config for the shared image-smoke harness (tests/image-smoke.sh, synced from
# cplieger/ci). The port is published, rather than probed with docker exec, so
# every client-facing HTTP check reaches the server the way a client does:
# through the image's all-interfaces LISTEN_ADDR, since the binary alone listens
# on loopback. curl and jq run on the runner; the image ships no jq.
# SMOKE_TIMEOUT: the HEALTHCHECK's 15s start-period plus two 30s intervals,
# rounded up.
SMOKE_APP_NAME=web-terminal-server
SMOKE_TIMEOUT=90
SMOKE_LICENSE_TREE=1
wts_password="smoke-pw-$$"
SMOKE_RUN_ARGS="-p 127.0.0.1::7681 -e AUTH_PASSWORD=$wts_password"

# HTTP status of a GET of $1 through the published port, extra args to curl;
# 000 when nothing answered.
wts_status() {
  wts_path=$1
  shift
  curl -s --max-time 5 -o /dev/null -w '%{http_code}' "$@" "$wts_base$wts_path" || true
}

smoke_verify() {
  for wts_tool in docker curl jq; do
    command -v "$wts_tool" >/dev/null 2>&1 || {
      printf 'FAIL: %s is required on the runner\n' "$wts_tool" >&2
      return 1
    }
  done

  wts_addr=$(docker port "$SMOKE_CONTAINER" 7681/tcp | head -n 1)
  case "$wts_addr" in
    127.0.0.1:*) ;;
    *)
      printf 'FAIL: port 7681 is not published on loopback (docker port: "%s")\n' "$wts_addr" >&2
      return 1
      ;;
  esac
  wts_base="http://$wts_addr"
  wts_auth="admin:$wts_password"

  wts_code=$(wts_status /healthz -u "$wts_auth")
  [ "$wts_code" = 200 ] || {
    printf 'FAIL: /healthz (authenticated) = %s through the published port, want 200\n' "$wts_code" >&2
    return 1
  }

  wts_hc=$(docker inspect --format '{{join .Config.Healthcheck.Test " "}}' "$IMG")
  docker exec "$SMOKE_CONTAINER" sh -c "${wts_hc#CMD-SHELL }" || {
    printf 'FAIL: shipped HEALTHCHECK probe failed under auth (does it send credentials?)\n' >&2
    return 1
  }

  wts_body=$(curl -s --max-time 5 -u "$wts_auth" "$wts_base/") || {
    printf 'FAIL: / (authenticated) did not answer\n' >&2
    return 1
  }
  wts_code=$(wts_status / -u "$wts_auth")
  [ "$wts_code" = 200 ] || {
    printf 'FAIL: / (authenticated) = %s, want 200\n' "$wts_code" >&2
    return 1
  }
  printf '%s\n' "$wts_body" | grep -qiE 'term|<!doctype html|<html' || {
    printf 'FAIL: / body does not look like the UI scaffold\n' >&2
    return 1
  }

  # Derived from what is served, so a library moving a module or a renamed
  # content-hashed font fails here instead of going unchecked.
  wts_targets=$(printf '%s\n' "$wts_body" \
    | sed -n '/<script type="importmap">/,/<\/script>/p' \
    | grep -o '"/[^"]*"' | tr -d '"')
  [ -n "$wts_targets" ] || {
    printf 'FAIL: no importmap module paths found in the served page (the page lost its importmap, or the extraction is broken)\n' >&2
    return 1
  }
  wts_css=$(curl -s --max-time 5 -u "$wts_auth" "$wts_base/style.css") || {
    printf 'FAIL: /style.css (authenticated) did not answer\n' >&2
    return 1
  }
  wts_fonts=$(printf '%s\n' "$wts_css" \
    | grep -oE "url\([[:space:]]*[\"']?/vendor/fonts/[^\"')[:space:]]+" \
    | sed 's|.*/vendor/fonts/|/vendor/fonts/|' | sort -u)
  [ -n "$wts_fonts" ] || {
    printf 'FAIL: the served bundle names no /vendor/fonts asset (the CSS bundle is empty, or the extraction is broken)\n' >&2
    return 1
  }
  wts_nmod=0
  wts_nfont=0
  for wts_asset in $wts_targets /style.css $wts_fonts; do
    wts_code=$(wts_status "$wts_asset" -u "$wts_auth")
    [ "$wts_code" = 200 ] || {
      printf 'FAIL: bundle asset %s = %s, want 200 (UI bundle incomplete)\n' "$wts_asset" "$wts_code" >&2
      return 1
    }
    case "$wts_asset" in
      /vendor/fonts/*) wts_nfont=$((wts_nfont + 1)) ;;
      /style.css) ;;
      *) wts_nmod=$((wts_nmod + 1)) ;;
    esac
  done

  # CSP hash-pinning stops injected script driving a root shell; COOP and
  # Referrer-Policy keep a clicked OSC 8 link from reaching window.opener. Both
  # regress silently.
  wts_headers=$(curl -s --max-time 5 -D - -o /dev/null -u "$wts_auth" "$wts_base/") || {
    printf 'FAIL: / (authenticated) did not answer the header probe\n' >&2
    return 1
  }
  for wts_expected in \
    'content-security-policy:.*script-src' \
    'x-content-type-options: *nosniff' \
    'x-frame-options: *DENY' \
    'referrer-policy: *same-origin' \
    'cross-origin-opener-policy: *same-origin' \
    'permissions-policy: *camera=()'; do
    printf '%s\n' "$wts_headers" | grep -qiE "$wts_expected" || {
      printf 'FAIL: response is missing a hardened header matching /%s/\n' "$wts_expected" >&2
      return 1
    }
  done
  if printf '%s\n' "$wts_headers" | grep -qi "content-security-policy:.*'unsafe-inline'"; then
    printf "FAIL: the CSP carries 'unsafe-inline'; the inline script and style must stay hash-pinned\n" >&2
    return 1
  fi

  # A real session first, so this also proves the REST surface is mounted.
  wts_out=$(curl -s --max-time 5 -u "$wts_auth" -X POST "$wts_base/api/sessions") || {
    printf 'FAIL: POST /api/sessions did not answer\n' >&2
    return 1
  }
  wts_id=$(printf '%s' "$wts_out" | jq -r '.id // empty' 2>/dev/null) || wts_id=""
  [ -n "$wts_id" ] || {
    printf 'FAIL: POST /api/sessions did not return a session id\n' >&2
    return 1
  }
  wts_ws=$(wts_status "/ws?session=$wts_id" -u "$wts_auth")
  case "$wts_ws" in
    400 | 426 | 405 | 101) ;;
    *)
      printf 'FAIL: /ws?session=<id> (no upgrade) = %s, want 400/426/405 (handler mounted)\n' "$wts_ws" >&2
      return 1
      ;;
  esac
  # No pre-upgrade 404 oracle for session existence: an unknown session is
  # close 4004, after the upgrade only.
  wts_code=$(wts_status /ws -u "$wts_auth")
  [ "$wts_code" = 426 ] || {
    printf 'FAIL: /ws (no session param) = %s, want 426 (same as known session; no existence oracle)\n' "$wts_code" >&2
    return 1
  }

  for wts_path401 in / /healthz /ws; do
    wts_code=$(wts_status "$wts_path401")
    [ "$wts_code" = 401 ] || {
      printf 'FAIL: unauthenticated %s = %s, want 401\n' "$wts_path401" "$wts_code" >&2
      return 1
    }
  done
  wts_h401=$(curl -s --max-time 5 -D - -o /dev/null "$wts_base/healthz") || wts_h401=""
  printf '%s\n' "$wts_h401" | grep -qi '^www-authenticate:' || {
    printf 'FAIL: 401 response missing WWW-Authenticate challenge\n' >&2
    return 1
  }

  # The harness verdict reads the same whether this hook ran or not.
  printf 'web-terminal-server payload: via %s, %s importmap modules, %s fonts and /style.css served under auth; hardened headers present; /ws non-upgrade = %s, sessionless = 426; / /healthz /ws = 401 + challenge without credentials\n' \
    "$wts_addr" "$wts_nmod" "$wts_nfont" "$wts_ws"
}

# Extend gitleaks' default ruleset and allowlist two known false positives.
#
# gitleaks scans git HISTORY, and commit 5c9a69b (2026-06-30) carried an earlier
# healthcheck that passed credentials with `curl -u`:
#   curl -sf -u "${WT_USERNAME:-admin}:${WT_PASSWORD:-}" http://127.0.0.1:7681/healthz
# Its curl-auth-user rule flags that -u argument, but it is shell parameter
# expansion (env vars resolved at runtime), not an embedded credential. The
# CURRENT Dockerfile no longer uses -u at all: it feeds a curl config file on
# stdin (`-K -`) so the password never reaches argv, which also splits the two
# expansions across separate lines. So this allowlist exists ONLY for the
# historical commit, and removing it makes the scan fail on history rather than on
# the tree. Verified 2026-08: with useDefault alone the scan reports exactly that
# one hit, and nothing in the working tree.
#
# The WT_ names below are HISTORICAL SPELLINGS and must not be renamed with the
# rest of the tree. The operator knobs became AUTH_USERNAME / AUTH_PASSWORD, but
# this regex matches bytes in an immutable commit, so updating it to the new names
# would stop matching and turn the full-history scan red.
[extend]
useDefault = true

[[allowlists]]
description = "historical Dockerfile healthcheck curl -u referenced the pre-rename WT_USERNAME/WT_PASSWORD env vars, not a real secret"
regexTarget = "line"
regexes = ['''\$\{WT_USERNAME:-admin\}:\$\{WT_PASSWORD:-\}''']

# Go test fixtures are synthetic placeholders, and the generic-api-key rule keys on
# the IDENTIFIER next to a value ("token", "apiKey"), so a fake session id named for
# what it is reads as a credential. The fake /ws session id in main_test.go is
# one, and the full-history scan reports it on every run. `targetRules` is
# load-bearing: with gitleaks 8.30.1 the rule-scoped form reports a fake PAT in a
# test file and drops the fixture, while a blanket `paths` allowlist reports
# neither, so every provider rule stays live over test files.
[[allowlists]]
description = "generic-api-key over Go test fixtures: synthetic placeholders named token/key, not credentials"
targetRules = ["generic-api-key"]
paths = ['''_test\.go$''']

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<!-- Stamped at startup from PERSIST_SCROLLBACK (static_persist.go applyPersistFlag),
     which matches this exact byte string and fails startup if it is missing. -->
<meta name="wt-persist-scrollback" content="on">
<title>Web Terminal</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<!-- createTerminal awaits document.fonts.load for this face before its first
     resize and nothing else requests the file. crossorigin is mandatory even
     same-origin, or the font downloads twice into a separate cache partition. -->
<link rel="preload" href="/vendor/fonts/MonaspaceNeonNF-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
<!-- [html-validate-disable-next no-style-tag -- brand token for the loading overlay] -->
<style>
/* Keep exactly ONE inline <style> in this file: buildCSPPolicy (main.go) hashes it
   for style-src and fails startup on any other count. */
#loading {
  --wt-loading-accent: #6ea8ff;
}
</style>
</head>
<body>
<!-- The loading overlay is a sibling of the root so createTerminal never clears it. -->
<div id="terminal"></div>
<!-- role="status" is load-bearing: the kernel writes its progressive startup
     line in here, and the library's toast and banner paint UNDER this overlay. -->
<div id="loading" class="wt-loading" role="status" aria-label="Loading">
  <div class="wt-loading-bar" aria-hidden="true"></div>
</div>
<!-- The engine specifier is resolved transitively from the UI package's emitted imports. -->
<script type="importmap">
{
  "imports": {
    "@cplieger/web-terminal-engine": "/vendor/cplieger-web-terminal-engine/index.js",
    "@cplieger/web-terminal-ui": "/vendor/cplieger-web-terminal-ui/index.js",
    "@cplieger/web-terminal-ui/presets": "/vendor/cplieger-web-terminal-ui/presets.js"
  }
}
</script>
<script type="module">
  import { createTerminal, localScrollbackStorage } from "@cplieger/web-terminal-ui";
  import { presetTabbed } from "@cplieger/web-terminal-ui/presets";
  // The root goes in as a SELECTOR and the preset as an ARROW so both resolve
  // inside createTerminal's failure boundary: a missing #terminal or a throwing
  // preset renders the library's "Terminal failed to start" panel instead of a
  // spinner that never stops.
  const persist =
    document.querySelector('meta[name="wt-persist-scrollback"]')?.getAttribute("content") === "on";
  // persistScrollback is OMITTED rather than passed as undefined when off,
  // because the option's presence is what enables the feature.
  //
  // attentionIcons promises that static/ serves favicon-{input,done,alert} in all
  // three icon formats (main_test.go asserts it against the embedded tree).
  createTerminal("#terminal", {
    features: () => presetTabbed({ attentionIcons: true }),
    split: true,
    loading: document.getElementById("loading"),
    ...(persist ? { persistScrollback: localScrollbackStorage() } : {}),
  });
</script>
</body>
</html>

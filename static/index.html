<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="color-scheme" content="dark">
<title>Web Terminal</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="/style.css">
<!-- [html-validate-disable-next no-style-tag -- brand token for the loading overlay] -->
<style>
/* The loading overlay's appearance lives in web-terminal-ui's css/page.css, which
   /style.css above concatenates; this page used to carry a byte-identical copy of
   it inline for no benefit (that link is render-blocking, so nothing painted
   sooner either way) and the one loading screen therefore existed three times
   across the family. All that is left here is this server's own accent, set as
   the library's overlay token -- the same override mechanism the component tokens
   use, except the overlay is our element so no JS is involved.
   Keep exactly ONE inline <style> in this file: buildCSPPolicy (main.go) hashes it
   for style-src and fails startup loudly on any other count. */
#loading {
  --wt-loading-accent: #6ea8ff;
}
</style>
</head>
<body>
<!-- createTerminal() builds the entire terminal UI inside this root element;
     the loading overlay is a sibling so it is never cleared (it fades on the
     first frame). -->
<div id="terminal"></div>
<!-- Styled by css/page.css through the wt-loading* CLASSES, not by this id.
     role="status" is load-bearing: once startup takes more than a few seconds the
     kernel writes a progressive status line in here (and the session owner can
     replace it with the server's own reason), which is the feedback this page
     previously had no way to show at all -- the library's toast and banner both
     live inside .wt-root and paint UNDER this overlay. -->
<div id="loading" class="wt-loading" role="status" aria-label="Loading">
  <div class="wt-loading-bar" aria-hidden="true"></div>
</div>
<!-- The importmap resolves the bare package specifiers to the JS the server
     compiles into /vendor/ at build time; the engine specifier is resolved
     transitively from the UI package's emitted imports, and the UI's ./presets
     subpath maps to its compiled presets.js. -->
<script type="importmap">
{
  "imports": {
    "@cplieger/web-terminal-engine": "/vendor/cplieger-web-terminal-engine/index.js",
    "@cplieger/web-terminal-ui": "/vendor/cplieger-web-terminal-ui/index.js",
    "@cplieger/web-terminal-ui/presets": "/vendor/cplieger-web-terminal-ui/presets.js"
  }
}
</script>
<script type="module">
  import { createTerminal } from "@cplieger/web-terminal-ui";
  import { presetTabbed } from "@cplieger/web-terminal-ui/presets";
  // The root goes in as a SELECTOR and the preset as a FUNCTION, and both are
  // load-bearing rather than stylistic. createTerminal resolves the selector and
  // calls the preset inside its own failure boundary, so a missing #terminal or a
  // preset that throws lowers the overlay and renders the library's "Terminal
  // failed to start" panel with a Reload button. This script is inline, so tsc
  // never sees it: written the old way -- passing document.getElementById("terminal")
  // and presetTabbed() -- a missing root reached the library as null and threw a
  // SECOND error out of its own catch, and a throwing preset never reached it at
  // all. Either way this page had no recovery surface of its own, so the user got
  // a spinner that never stops.
  createTerminal("#terminal", {
    features: presetTabbed,
    loading: document.getElementById("loading"),
  });
</script>
</body>
</html>
